[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artcrit"
version = "0.1.0"
description = "Agentic art critique: compare a drawing to its reference photo and suggest located fixes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.9,<5.1",
  "numpy>=1.26",
  "pillow>=10.3",
  "pillow-heif>=0.16",
  "pydantic>=2.6",
  "claude-agent-sdk>=0.1",
  "mediapipe==1.2.3",
  "markdown==3.11.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
artcrit = "artcrit.cli:main"

[tool.setuptools.packages.find]
include = ["artcrit*"]

[tool.setuptools.package-data]
artcrit = ["store/*.sql", "web/templates/*.html", "web/static/*", "site/templates/*.html", "site/static/*"]

[tool.pytest.ini_options]
markers = ["live: calls the real Claude engine (set ARTCRIT_LIVE=1)", "models: needs downloaded model files (artcrit fetch-models)"]
addopts = "-m 'not live'"
